<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>w2e - love.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg"></div>

    <div class="lyrics">
        <div class="line">사람 사이 사람</div>
        <div class="line">바람 사이 바람</div>
        <div class="line">각자의 염원이 바래고</div>
        <div class="line">덧칠되어...</div>
        <div class="line">발이 닿을 만큼</div>
        <div class="line">굳어지면...</div>
        <div class="line">비로소 내 세상이</div>
        <div class="line">되어줘.</div>
    </div>

    <script>
        const lines = document.querySelectorAll('.line');
        
        // Verified millisecond delays to match the studio track vocal cues
        const timings = [
            4200,  // Line 1: Fades in at 0:18 -> stays until 0:22.2
            4300,  // Line 2: Fades in at 0:22.2 -> stays until 0:26.5
            4800,  // Line 3: Fades in at 0:26.5 -> stays until 0:31.3
            4000,  // Line 4: Fades in at 0:31.3 -> clear screen during drum cue at 0:35.3
            5200,  // Line 5: Fades in at 0:37.2 (after brief pause) -> stays until 0:42.4
            4300,  // Line 6: Fades in at 0:42.4 -> stays until 0:46.7
            4800,  // Line 7: Fades in at 0:46.7 -> stays until 0:51.5
            6500   // Line 8: Fades in at 0:51.5 -> lingering finish right before the main chorus at 0:58
        ];
        
        let currentIndex = 0;

        function showNextLine() {
            lines.forEach(line => line.classList.remove('active'));

            if (currentIndex < lines.length) {
                lines[currentIndex].classList.add('active');

                setTimeout(() => {
                    currentIndex++;
                    showNextLine();
                }, timings[currentIndex]);
            } else {
                // Reset loop to begin again on restart
                currentIndex = 0;
                setTimeout(showNextLine, 1500);
            }
        }

        showNextLine();
    </script>
</body>
</html>
