<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>w2e - love.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg"></div>

    <div class="lyrics">
        <div class="line">사람 사이 사람</div>
        <div class="line">바람 사이 바람</div>
        <div class="line">각자의 염원이 바래고</div>
        <div class="line">덧칠되어...</div>
        <div class="line">발이 닿을 만큼</div>
        <div class="line">굳어지면...</div>
        <div class="line">비로소 내 세상이</div>
        <div class="line">되어줘.</div>
    </div>

    <script>
        const lines = document.querySelectorAll('.line');
        
        // Increased durations so the lyrics breathe more
        const timings = [4500, 4800, 4200, 3200, 5200, 4500, 5200, 7000];
        let currentIndex = 0;

        function showNextLine() {
            lines.forEach(line => line.classList.remove('active'));

            if (currentIndex < lines.length) {
                lines[currentIndex].classList.add('active');

                setTimeout(() => {
                    currentIndex++;
                    showNextLine();
                }, timings[currentIndex]);
            } else {
                currentIndex = 0;
                setTimeout(showNextLine, 1500); // slightly longer pause before it loops
            }
        }

        showNextLine();
    </script>
</body>
</html>
