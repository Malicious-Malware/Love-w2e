<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>w2e - love. (MV Version)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg"></div>

    <div class="lyrics">
        <div class="line">사람 사이 사람</div>
        <div class="line">바람 사이 바람</div>
        <div class="line">각자의 염원이 바래고</div>
        <div class="line">덧칠되어...</div>
        <div class="line">발이 닿을 만큼</div>
        <div class="line">굳어지면...</div>
        <div class="line">비로소 내 세상이</div>
        <div class="line">되어줘.</div>
    </div>

    <script>
        const lines = document.querySelectorAll('.line');
        
        // Exact millisecond gaps mapped directly to the YouTube MV timestamps
        const timings = [
            4200,  // Line 1: 0:18.5 -> 0:22.7
            4300,  // Line 2: 0:22.7 -> 0:27.0
            3200,  // Line 3: 0:27.0 -> 0:30.2 (Cuts away fast so Line 4 enters on cue)
            6800,  // Line 4: 0:30.2 -> 0:37.0 (Holds beautifully through the MV drum break)
            5300,  // Line 5: 0:37.0 -> 0:42.3
            4300,  // Line 6: 0:42.3 -> 0:46.6
            4900,  // Line 7: 0:46.6 -> 0:51.5
            9500   // Line 8: 0:51.5 -> 1:01.0 (Outro holding until the scene changes)
        ];
        
        let currentIndex = 0;

        function showNextLine() {
            lines.forEach(line => line.classList.remove('active'));

            if (currentIndex < lines.length) {
                lines[currentIndex].classList.add('active');

                setTimeout(() => {
                    currentIndex++;
                    showNextLine();
                }, timings[currentIndex]);
            } else {
                currentIndex = 0;
                // 2-second delay before restarting from the 18.5-second intro mark
                setTimeout(showNextLine, 2000);
            }
        }

        // Hard-synced to trigger exactly at the 18.5s mark of the video
        setTimeout(showNextLine, 18500);
    </script>
</body>
</html>
