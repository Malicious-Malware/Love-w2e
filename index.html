<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>w2e - love.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg"></div>

    <div class="lyrics">
        <div class="line">사람 사이 사람</div>
        <div class="line">바람 사이 바람</div>
        <div class="line">각자의 염원이 바래고</div>
        <div class="line">덧칠되어...</div>
        <div class="line">발이 닿을 만큼</div>
        <div class="line">굳어지면...</div>
        <div class="line">비로소 내 세상이</div>
        <div class="line">되어줘.</div>
    </div>

    <script>
        const lines = document.querySelectorAll('.line');
        
        // Tweaked Line 3 to stay longer, and balanced the surrounding delays
        const timings = [
            4200,  // Line 1: 사람 사이 사람
            4300,  // Line 2: 바람 사이 바람
            5400,  // Line 3: Increased duration so it doesn't feel rushed anymore
            3800,  // Line 4: 덧칠되어...
            5200,  // Line 5: 발이 닿을 만큼
            4300,  // Line 6: 굳어지면...
            4800,  // Line 7: 비로소 내 세상이
            6500   // Line 8: 되어줘.
        ];
        
        let currentIndex = 0;

        function showNextLine() {
            lines.forEach(line => line.classList.remove('active'));

            if (currentIndex < lines.length) {
                lines[currentIndex].classList.add('active');

                setTimeout(() => {
                    currentIndex++;
                    showNextLine();
                }, timings[currentIndex]);
            } else {
                currentIndex = 0;
                // Wait 1.5 seconds before starting the entire loop over
                setTimeout(showNextLine, 1500);
            }
        }

        // 5000ms (5 seconds) built-in countdown buffer at startup. 
        // Just play the song from 0:00 and refresh your page at the same time!
        setTimeout(showNextLine, 5000);
    </script>
</body>
</html>
